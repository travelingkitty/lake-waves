# Keeps the public page current without anyone's computer on:
# pull the newest GLERL run, prove the water still matches it, deploy.
name: Refresh forecast and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *' # GLERL posts two runs a day; check every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull the latest GLERL forecast for Chicago (45198)
        run: npm run data || echo "::warning::GLERL fetch failed; deploying the committed snapshot"
      - name: Check the simulated water against the forecast
        run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
